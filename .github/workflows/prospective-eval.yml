name: prospective-evaluation

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN SYNTHETIC EVALUATION to authorize paid model calls
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      OPENAI_MODEL: gpt-4o
      WAREHOUSE_DB: ${{ github.workspace }}/data/healthcare_demo.duckdb
    steps:
      - name: Check explicit authorization and credentials
        run: |
          if [ "$CONFIRMATION" != 'RUN SYNTHETIC EVALUATION' ]; then
            echo 'The paid evaluation was not authorized.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run frozen synthetic challenge
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'The OPENAI_API_KEY repository secret is not configured.'
            exit 1
          fi
          python -m agent.prospective_eval --output prospective-results.json
      - name: Upload result report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prospective-results-${{ github.run_id }}
          path: prospective-results.json
          if-no-files-found: warn
          retention-days: 90
