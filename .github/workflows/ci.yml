name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded push's run is wasted compute — cancel it when a newer commit arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warehouse-and-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # a hung download/build must not burn the 6h default
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"        # Synthea's build target

      - name: Install dependencies
        run: pip install -r requirements-dev.txt   # app runtime + dbt

      - name: Lint (ruff) + unit tests (pytest) with coverage gate — fast, no API key
        run: |
          ruff check .
          pytest --cov=agent --cov-report=term-missing

      # The extracted guardrail library, tested on its own. It has no healthcare, dbt or warehouse
      # dependency, so it runs before any of the warehouse setup below and fails fast if broken.
      - name: caveat package tests (standalone, no warehouse)
        run: pytest packages/caveat/tests -q

      - name: assurance package tests (standalone, no warehouse)
        run: pytest packages/assurance/tests -q

      # Fail fast on a broken project BEFORE the expensive part. A bad ref(), an unresolved
      # source, or malformed schema YAML would otherwise surface only at `dbt build` below —
      # after downloading the Synthea jar and generating a dataset in Java, minutes in.
      # `dbt parse` catches all three in ~2s and never opens a warehouse connection, so it runs
      # here, before data exists. `dbt deps` first: the models use dbt_utils macros, and parse
      # exits 2 without them.
      - name: Validate the dbt project (parse only — no warehouse needed)
        working-directory: warehouse
        run: |
          dbt deps
          dbt parse --profiles-dir .

      - name: Generate a small, reproducible Synthea dataset
        # Pinned release (NOT master-branch-latest, a moving target that can break CI with no code
        # change and silently varies the generated data over time). Bump deliberately.
        run: |
          mkdir -p synthea data          # these dirs are git-ignored (empty) → recreate on checkout
          curl -L --fail -o synthea/synthea-with-dependencies.jar \
            https://github.com/synthetichealth/synthea/releases/download/v4.0.0/synthea-with-dependencies.jar
          cd synthea
          java -jar synthea-with-dependencies.jar \
            --exporter.csv.export true --exporter.fhir.export false \
            -p 60 -s 12345 -cs 12345 Massachusetts

      - name: Load raw CSVs into DuckDB
        run: python scripts/load_raw.py

      - name: dbt build (models + data tests)
        working-directory: warehouse
        run: |
          dbt deps
          dbt build --profiles-dir .

      - name: Regenerate semantic catalog from dbt artifacts
        run: |
          cd warehouse && dbt docs generate --profiles-dir . && cd ..
          python agent/build_catalog.py

      - name: Guardrail precision / recall (deterministic, no API key)
        run: python -m agent.guardrail_eval

      - name: Public synthetic contract benchmark (no API key)
        run: python -m agent.public_benchmark

      - name: Agent modules import cleanly
        run: python -c "import agent.agent, agent.retrieval, agent.warehouse, agent.guardrails"

  package-distributions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        package: [caveat, assurance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build packages/${{ matrix.package }} --outdir dist/${{ matrix.package }}
          cd dist/${{ matrix.package }}
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Install and test built wheel in a clean environment
        run: |
          python -m venv /tmp/package-test
          /tmp/package-test/bin/python -m pip install pytest dist/${{ matrix.package }}/*.whl
          cd /tmp
          /tmp/package-test/bin/python -m pytest "$GITHUB_WORKSPACE/packages/${{ matrix.package }}/tests" -q
      - name: Upload candidate distributions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-python-${{ matrix.python }}
          path: dist/${{ matrix.package }}

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the local application image
        run: docker build --tag clinical-insight-ci:${{ github.sha }} .
      - name: Start the image and check health without an API key
        run: |
          docker run --detach --name clinical-insight-smoke \
            --publish 127.0.0.1:18501:8080 \
            --env OPENAI_API_KEY= clinical-insight-ci:${{ github.sha }}
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18501/_stcore/health; then
              docker exec clinical-insight-smoke python -c 'import caveat, assurance; print("standalone imports OK")'
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' clinical-insight-smoke)" != "true" ]; then
              break
            fi
            sleep 2
          done
          docker logs clinical-insight-smoke
          exit 1
      - name: Remove the test container
        if: always()
        run: docker rm --force clinical-insight-smoke || true
