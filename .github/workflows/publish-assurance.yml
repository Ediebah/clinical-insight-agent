# Review the `pypi` environment, source, checksums, and license terms before dispatch.
name: Publish reviewed clinical-insight-assurance

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - clinical-insight-assurance
      approval:
        description: Type PUBLISH REVIEWED ARTIFACTS after the release review
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: b9c163b12d0cb5571edcffb736550b50fcdcacd2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and compare with the reviewed candidate checksums
        env:
          PACKAGE: ${{ inputs.package }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          test "$APPROVAL" = 'PUBLISH REVIEWED ARTIFACTS'
          case "$PACKAGE" in
            clinical-insight-assurance)
              project=packages/assurance
              wheel=clinical_insight_assurance-0.3.0-py3-none-any.whl
              source=clinical_insight_assurance-0.3.0.tar.gz
              wheel_sha=2b33e21b1a856a72adbe58a77e98ceead16c7d25c419eb27ff2174bc731f893b
              source_sha=15c07e1321d404f24bf21bf75032371c88a0d03fe3be1a1594f56b489d747b58
              ;;
            *) echo 'Unsupported package' >&2; exit 1 ;;
          esac
          python -m pip install 'build==1.5.0'
          python -m build "$project" --outdir dist
          cd dist
          shopt -s nullglob dotglob
          files=(*)
          test "${#files[@]}" -eq 2
          printf '%s  %s\n%s  %s\n' "$wheel_sha" "$wheel" "$source_sha" "$source" | sha256sum -c -
          cd "$RUNNER_TEMP"
          python -m venv release-test
          release-test/bin/python -m pip install pytest "$GITHUB_WORKSPACE/dist/$wheel"
          release-test/bin/python -m pytest "$GITHUB_WORKSPACE/$project/tests" -q
          cd "$GITHUB_WORKSPACE/dist"
          files=(*)
          test "${#files[@]}" -eq 2
          printf '%s  %s\n%s  %s\n' "$wheel_sha" "$wheel" "$source_sha" "$source" | sha256sum -c -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-package
          path: dist/
          if-no-files-found: error

  publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-package
          path: dist/
      - name: Recheck the reviewed artifacts immediately before publishing
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            clinical-insight-assurance)
              wheel=clinical_insight_assurance-0.3.0-py3-none-any.whl
              source=clinical_insight_assurance-0.3.0.tar.gz
              wheel_sha=2b33e21b1a856a72adbe58a77e98ceead16c7d25c419eb27ff2174bc731f893b
              source_sha=15c07e1321d404f24bf21bf75032371c88a0d03fe3be1a1594f56b489d747b58
              ;;
            *) echo 'Unsupported package' >&2; exit 1 ;;
          esac
          cd dist
          shopt -s nullglob dotglob
          files=(*)
          test "${#files[@]}" -eq 2
          printf '%s  %s\n%s  %s\n' "$wheel_sha" "$wheel" "$source_sha" "$source" | sha256sum -c -
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
