[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-insight-caveat"
version = "0.1.2"
description = "Statistical caveats for analysis results — what would stop a statistician believing this table."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Divine Ediebah" }]
keywords = ["statistics", "data-quality", "analytics", "llm", "agents", "text-to-sql",
            "confidence-intervals", "multiple-comparisons", "simpsons-paradox"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
# Deliberately no scipy. The normal CDF comes from math.erf and everything else is implemented
# in-package, so this stays installable inside someone else's agent without dragging in a
# research stack.
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Ediebah/clinical-insight-agent"
Source = "https://github.com/Ediebah/clinical-insight-agent/tree/main/packages/caveat"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
exclude = ["validation/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/caveat"]

[tool.ruff]
line-length = 110
