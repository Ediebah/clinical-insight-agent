[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assurance"
version = "0.1.0"
description = "Bayesian go/no-go for trial design and interim decisions. Conjugate, closed-form, no Monte Carlo."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Divine Ediebah" }]
keywords = ["assurance", "bayesian", "clinical-trials", "go-no-go", "sample-size",
            "predictive-probability", "futility", "interim-analysis", "operating-characteristics",
            "biostatistics", "drug-development", "medical-devices"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Ediebah/clinical-insight-agent"
Source = "https://github.com/Ediebah/clinical-insight-agent/tree/main/packages/assurance"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/assurance"]

[tool.ruff]
line-length = 110
